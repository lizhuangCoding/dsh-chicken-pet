# dsh-chicken-pet bundle patch: one browser plugin row over the profile root.
#
# Applied after the shipped bundles, so the user's own cordis.patch.yml can
# still address this row by id (`chicken-pet`) and replace its config.

- insert:
    - id: chicken-pet
      name: 'dsh-chicken-pet/client'
      config:
        # Where the pet rests before the user drags it.
        corner: bottom-right
        marginX: 24
        marginY: 24
        # Rendered width in CSS pixels; height follows the 192x208 cell ratio.
        size: 128
        # Master switches.
        enabled: true
        sound: true
        # Idle autonomy: seconds between behaviour rolls, and how lively the
        # chicken is (0 = rarely moves, 1 = constantly busy).
        idleMinSec: 4
        idleMaxSec: 12
        liveliness: 0.75
        # Volume of the cheer, 0-1.
        volume: 0.85
